<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Turntable</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turntable">
<link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
<main id="controls">
  <header>
    <h1>Turntable</h1>
    <span id="signal" class="pill">…</span>
  </header>
  <section id="now" hidden>
    <img id="art" alt="">
    <div><div id="np-title"></div><div id="np-artist"></div></div>
  </section>
  <section id="listening" class="kiosk-hide" hidden>
    <h2>Who's listening? <small>Scrobbles to Last.fm</small></h2>
    <div id="listeners" class="chips"></div>
  </section>
  <ul id="rooms"><li class="empty">Looking for Sonos rooms…</li></ul>
  <section id="screen" class="kiosk-hide">
    <h2>Pi screen</h2>
    <div class="choices">
      <button data-mode="controls">Controls</button>
      <button data-mode="viz" data-style="0">Record</button>
      <button data-mode="viz" data-style="1">Bars</button>
      <button data-mode="viz" data-style="2">Waveform</button>
      <button data-mode="viz" data-style="3">Fireplace</button>
      <button data-mode="viz" data-style="4">Now Playing</button>
      <button data-mode="off">Off</button>
    </div>
  </section>
  <section id="settings" class="kiosk-hide">
    <h2>Settings</h2>
    <div class="setting"><span id="auto-label">Auto-play</span><button class="toggle" data-key="auto_play" aria-pressed="false"></button></div>
    <div class="setting"><span>Show song on visualizer</span><button class="toggle" data-key="song_overlay" aria-pressed="false"></button></div>
    <div class="setting"><span>Sleep Pi screen when idle</span><button class="toggle" data-key="screen_sleep" aria-pressed="false"></button></div>
    <div class="setting" id="lastfm" hidden>
      <span>Last.fm accounts<small id="lastfm-accounts"></small></span>
      <button id="lastfm-connect" class="small">Add account</button>
    </div>
    <div class="setting"><span>Lossless (FLAC)</span><button class="toggle" data-key="flac" aria-pressed="false"></button></div>
  </section>
  <footer>
    <button id="stop" class="wide">Stop all</button>
    <button id="visualize" class="wide accent">Visualize</button>
  </footer>
</main>
<section id="viz" hidden>
  <div id="np-view" hidden>
    <div class="np-stage">
      <div class="np-bg np-art"></div>
      <div class="np-record"><div class="np-label np-art"></div></div>
      <div class="np-sleeve np-art"></div>
      <div class="np-text"><div class="np-title"></div><div class="np-artist"></div><div class="np-album"></div></div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="viz-song" class="song" hidden>
    <img class="song-art" alt="">
    <div><div class="song-title"></div><div class="song-artist"></div></div>
  </div>
  <div id="viz-ui">
    <button id="viz-next">Next style</button>
    <button id="viz-close">Done</button>
  </div>
</section>
<div id="dark" hidden></div>
<script src="/static/app.js?v=23"></script>
</body>
</html>
